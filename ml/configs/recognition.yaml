project: ExpiryLens
task: date_text_recognition
seed: 42
image:
  height: 48
  max_width: 320
  channels: 1
  normalize: true
model:
  visual_encoder: cnn
  sequence_encoder: bilstm
  decoder: ctc
  vocabulary: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz:/.- "
training:
  batch_size: 16
  epochs: 50
  optimizer: adam
  learning_rate: 0.001
  early_stopping_patience: 8
  validation_split: 0.15
paths:
  train_annotations: data/annotations/train.jsonl
  validation_annotations: data/annotations/validation.jsonl
  test_annotations: data/annotations/test.jsonl
  artifacts: ml/artifacts
